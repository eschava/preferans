<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preferans</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <h1 id="apptitle"></h1>
    <div id="status"></div>
    <button id="replayback" hidden></button>
    <button id="roomcode" hidden></button>
    <div id="menuwrap">
      <button id="menubtn" aria-haspopup="true" aria-expanded="false">☰</button>
      <div id="menu" hidden>
        <button id="newgame"></button>
        <button id="showpulka"></button>
        <div id="langs"></div>
      </div>
    </div>
  </header>

  <main>
    <section id="table">
      <div class="seat opp" id="seat1"></div>
      <div id="center">
        <div id="talon"></div>
        <div id="trick"></div>
        <div id="lasttrick"></div>
        <dialog id="biddlg">
          <h2 id="bidtitle"></h2>
          <div class="ladder" id="bidstrip"></div>
          <div class="row" id="bidactions"></div>
        </dialog>

        <dialog id="askdlg">
          <h2 id="asktitle"></h2>
          <div id="asktext"></div>
          <div class="row" id="askactions"></div>
        </dialog>
      </div>
      <div class="seat opp" id="seat2"></div>
      <div class="seat me" id="seat0"></div>
    </section>

    <aside><div id="log"></div></aside>
  </main>

  <div id="actions"></div>
</div>

<dialog id="setupdlg">
  <div class="dlghead">
    <h2 id="setuptitle"></h2>
    <div id="setuplangs"></div>
  </div>
  <div id="setupbody"></div>
  <div class="row" id="setupactions"></div>
</dialog>

<dialog id="pulkadlg">
  <div id="pulkafinal" hidden></div>
  <div id="points"></div>
  <div id="score"></div>
  <div id="history"></div>
  <div class="row" id="pulkaactions"></div>
</dialog>

<script type="module" src="src/ui.js"></script>
</body>
</html>
